# Local infrastructure. Run the API on your host with `npm run dev`
# (or later add api/worker services here once the Prisma setup lands).
name: ems

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: ems
      POSTGRES_PASSWORD: ems
      POSTGRES_DB: ems
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ems -d ems"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports: ["6379:6379"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible object storage (uploads). MinIO no longer publishes images on Docker Hub,
  # so RustFS is used locally; the app only speaks the S3 API, so AWS S3 / R2 work the same.
  storage:
    image: rustfs/rustfs:1.0.4
    environment:
      RUSTFS_ACCESS_KEY: ems
      RUSTFS_SECRET_KEY: ems-storage-secret
      RUSTFS_CONSOLE_ENABLE: "true"
    ports: ["9000:9000", "9001:9001"] # 9000 = S3 API, 9001 = web console
    volumes:
      - storagedata:/data

  mailpit:
    image: axllent/mailpit:latest # catches all outgoing email; UI at http://localhost:8025
    ports: ["8025:8025", "1025:1025"]

volumes:
  pgdata:
  redisdata:
  storagedata:
